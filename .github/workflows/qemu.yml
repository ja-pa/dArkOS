name: QEMU target checks
on:
  push:
    paths: ['qemu/**', 'build_qemu.sh', 'build_*-qemu.sh', 'Makefile', '.github/workflows/qemu.yml']
  pull_request:
    paths: ['qemu/**', 'build_qemu.sh', 'build_*-qemu.sh', 'Makefile', '.github/workflows/qemu.yml']
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-utils qemu-system-arm qemu-system-gui
      - run: find qemu -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: gcc -Wall -Wextra -Werror -shared -fPIC qemu/capture.c -ldl -o /tmp/qemu-capture.so
      - run: python3 -m compileall -q qemu
      - run: python3 -m unittest discover -s qemu/tests -p 'test_*.py'
# Full GTK/WSLg integration requires the local ARM64 runtime and is invoked by
# make qemu-test; static CI does not claim that graphical validation passed.
